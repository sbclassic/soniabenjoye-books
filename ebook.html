async function getSecureDownloadUrl(book, format){
  const res = await fetch(
    `https://sb-bookstore-backend.onrender.com/generate-token?book=${book}&format=${format}`
  );

  const data = await res.json();

  return `https://sb-bookstore-backend.onrender.com/download?book=${book}&format=${format}&ts=${data.ts}&sig=${data.sig}`;
}
